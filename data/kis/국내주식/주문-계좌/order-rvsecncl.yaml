      04 : 최우선지정가

      05 : 장전 시간외

      06 : 장후 시간외

      07 : 시간외 단일가

      11 : IOC지정가 (즉시체결,잔량취소)

      12 : FOK지정가 (즉시체결,전량취소)

      13 : IOC시장가 (즉시체결,잔량취소)

      14 : FOK시장가 (즉시체결,전량취소)

      15 : IOC최유리 (즉시체결,잔량취소)

      16 : FOK최유리 (즉시체결,전량취소)

      21 : 중간가

      22 : 스톱지정가

      23 : 중간가IOC

      24 : 중간가FOK


      [NXT]

      00 : 지정가

      03 : 최유리지정가

      04 : 최우선지정가

      11 : IOC지정가 (즉시체결,잔량취소)

      12 : FOK지정가 (즉시체결,전량취소)

      13 : IOC시장가 (즉시체결,잔량취소)

      14 : FOK시장가 (즉시체결,전량취소)

      15 : IOC최유리 (즉시체결,잔량취소)

      16 : FOK최유리 (즉시체결,전량취소)

      21 : 중간가

      22 : 스톱지정가

      23 : 중간가IOC

      24 : 중간가FOK


      [SOR]

      00 : 지정가

      01 : 시장가

      03 : 최유리지정가

      04 : 최우선지정가

      11 : IOC지정가 (즉시체결,잔량취소)

      12 : FOK지정가 (즉시체결,전량취소)

      13 : IOC시장가 (즉시체결,잔량취소)

      14 : FOK시장가 (즉시체결,전량취소)

      15 : IOC최유리 (즉시체결,잔량취소)

      16 : FOK최유리 (즉시체결,전량취소)'
