id: e4a7e5fd-eed5-4a85-93f0-f46b804dae5f
name: 해외주식 주문[v1_해외주식-001]
section: '[해외주식] 주문/계좌'
category: 해외주식
subcategory: 주문/계좌
method: POST
url: /uapi/overseas-stock/v1/trading/order
content_type: application/json; charset=UTF-8
req_format: JSON
domains:
  real: https://openapi.koreainvestment.com:9443
  demo: https://openapivts.koreainvestment.com:29443
real_tr_id: (미국매수) TTTT1002U  (미국매도) TTTT1006U (아시아 국가 하단 규격서 참고)
demo_tr_id: (미국매수) VTTT1002U  (미국매도) VTTT1001U  (아시아 국가 하단 규격서 참고)
summary: "해외주식 주문 API입니다.\n\n* 모의투자의 경우, 모든 해외 종목 매매가 지원되지 않습니다. 일부 종목만 매매 가능한 점 유의 부탁드립니다.\n\n* 해외주식 서비스 신청 후 이용 가능합니다. (아래\
  \ 링크 3번 해외증권 거래신청 참고)\nhttps://securities.koreainvestment.com/main/bond/research/_static/TF03ca010001.jsp\n\n* 해외 거래소 운영시간\
  \ 외 API 호출 시 에러가 발생하오니 운영시간을 확인해주세요. (미국주식 주간주문은 \"해외주식 미국주간주문\"을 이용)\n* 해외 거래소 운영시간(한국시간 기준)\n1) 미국 : 23:30 ~ 06:00 (썸머타임\
  \ 적용 시 22:30 ~ 05:00) \n   * 프리마켓(18:00 ~ 23:30, Summer Time : 17:00 ~ 22:30), 애프터마켓(06:00 ~ 07:00, Summer Time : 05:00\
  \ ~ 07:00) 시간대에도 주문 가능\n2) 일본 : (오전) 09:00 ~ 11:30, (오후) 12:30 ~ 15:00\n3) 상해 : 10:30 ~ 16:00\n4) 홍콩 : (오전) 10:30 ~ 13:00,\
  \ (오후) 14:00 ~ 17:00\n\n* 기존에는 내부통제 요건에 따라 상장주식수의 1%를 초과하는 주문은 접수할 수 없었으나, 2025.08.14 시행 이후부터는 접수가 가능합니다. 단, 타 매체(HTS 등)는\
  \ 안내 팝업 확인 후 주문이 가능하지만, Open API는 별도의 안내 화면 없이 주문이 바로 접수되므로 유의하시기 바랍니다.\n\n\n※ POST API의 경우 BODY값의 key값들을 대문자로 작성하셔야 합니다.\n\
  \   (EX. \"CANO\" : \"12345678\", \"ACNT_PRDT_CD\": \"01\",...)\n\n※ 종목코드 마스터파일 파이썬 정제코드는 한국투자증권 Github 참고 부탁드립니다.\n   https://github.com/koreainvestment/open-trading-api/tree/main/stocks_info"
description: '[해외주식-001 v1] 해외주식 주문'
metadata:
  organization: 한국투자증권
  billing_policy: 무과금
  status: RUNNING
  created_date: '2021-12-15T13:08:00+09:00'
  last_modified_date: '2025-08-14T12:10:52+09:00'
request:
  headers:
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '40'
    required: false
    description: application/json; charset=utf-8
  - code: authorization
    name: 접근토큰
    type: A0001
    type_name: String
    length: '350'
    required: true
    description: 'OAuth 토큰이 필요한 API 경우 발급한 Access token

      일반고객(Access token 유효기간 1일, OAuth 2.0의 Client Credentials Grant 절차를 준용)

      법인(Access token 유효기간 3개월, Refresh token 유효기간 1년, OAuth 2.0의 Authorization Code Grant 절차를 준용)


      ※ 토큰 지정시 토큰 타입("Bearer") 지정 필요. 즉, 발급받은 접근토큰 앞에 앞에 "Bearer" 붙여서 호출

      EX) "Bearer eyJ..........8GA"'
  - code: appkey
    name: '앱키 '
    type: A0001
    type_name: String
    length: '36'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appkey (절대 노출되지 않도록 주의해주세요.)
  - code: appsecret
    name: 앱시크릿키
    type: A0001
    type_name: String
    length: '180'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appsecret (절대 노출되지 않도록 주의해주세요.)
  - code: personalseckey
    name: 고객식별키
    type: A0001
    type_name: String
    length: '180'
    required: false
    description: '[법인 필수] 제휴사 회원 관리를 위한 고객식별키'
  - code: tr_id
    name: 거래ID
    type: A0001
    type_name: String
    length: '13'
    required: true
    description: "[실전투자]\nTTTT1002U : 미국 매수 주문\nTTTT1006U : 미국 매도 주문\nTTTS0308U : 일본 매수 주문\nTTTS0307U : 일본 매도 주문 \nTTTS0202U\
      \ : 상해 매수 주문\nTTTS1005U : 상해 매도 주문\nTTTS1002U : 홍콩 매수 주문\nTTTS1001U : 홍콩 매도 주문\nTTTS0305U : 심천 매수 주문\nTTTS0304U : 심천\
      \ 매도 주문\nTTTS0311U : 베트남 매수 주문 \nTTTS0310U : 베트남 매도 주문 \n\n[모의투자]\nVTTT1002U : 미국 매수 주문\nVTTT1001U : 미국 매도 주문\nVTTS0308U\
      \ : 일본 매수 주문\nVTTS0307U : 일본 매도 주문 \nVTTS0202U : 상해 매수 주문\nVTTS1005U : 상해 매도 주문\nVTTS1002U : 홍콩 매수 주문\nVTTS1001U : 홍콩\
      \ 매도 주문\nVTTS0305U : 심천 매수 주문\nVTTS0304U : 심천 매도 주문\nVTTS0311U : 베트남 매수 주문 \nVTTS0310U : 베트남 매도 주문"
  - code: tr_cont
    name: 연속 거래 여부
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: tr_cont를 이용한 다음조회 불가 API
  - code: custtype
    name: 고객타입
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: 'B : 법인

      P : 개인'
  - code: seq_no
    name: 일련번호
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: '[법인 필수] 001'
  - code: mac_address
    name: 맥주소
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: 법인고객 혹은 개인고객의 Mac address 값
  - code: phone_number
    name: 핸드폰번호
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: '[법인 필수] 제휴사APP을 사용하는 경우 사용자(회원) 핸드폰번호

      ex) 01011112222 (하이픈 등 구분값 제거)'
  - code: ip_addr
    name: 접속 단말 공인 IP
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: '[법인 필수] 사용자(회원)의 IP Address'
  - code: gt_uid
    name: Global UID
    type: A0001
    type_name: String
    length: '32'
    required: false
    description: '[법인 전용] 거래고유번호로 사용하므로 거래별로 UNIQUE해야 함'
  params: []
  body:
  - code: CANO
    name: 종합계좌번호
    type: A0001
    type_name: String
    length: '8'
    required: true
    description: 계좌번호 체계(8-2)의 앞 8자리
  - code: ACNT_PRDT_CD
    name: 계좌상품코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: 계좌번호 체계(8-2)의 뒤 2자리
  - code: OVRS_EXCG_CD
    name: 해외거래소코드
    type: A0001
    type_name: String
    length: '4'
    required: true
    description: 'NASD : 나스닥

      NYSE : 뉴욕

      AMEX : 아멕스

      SEHK : 홍콩

      SHAA : 중국상해

      SZAA : 중국심천

      TKSE : 일본

      HASE : 베트남 하노이

      VNSE : 베트남 호치민'
  - code: PDNO
    name: 상품번호
    type: A0001
    type_name: String
    length: '12'
    required: true
    description: 종목코드
  - code: ORD_QTY
    name: 주문수량
    type: A0001
    type_name: String
    length: '10'
    required: true
    description: 주문수량 (해외거래소 별 최소 주문수량 및 주문단위 확인 필요)
  - code: OVRS_ORD_UNPR
    name: 해외주문단가
    type: A0001
    type_name: String
    length: '31'
    required: true
    description: '1주당 가격

      * 시장가의 경우 1주당 가격을 공란으로 비우지 않음 "0"으로 입력'
  - code: CTAC_TLNO
    name: 연락전화번호
    type: A0001
    type_name: String
    length: '20'
    required: false
    description: ''
  - code: MGCO_APTM_ODNO
    name: 운용사지정주문번호
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: ''
  - code: SLL_TYPE
    name: 판매유형
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: '제거 : 매수

      00 : 매도'
  - code: ORD_SVR_DVSN_CD
    name: 주문서버구분코드
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: '"0"(Default)'
  - code: ORD_DVSN
    name: 주문구분
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: '[Header tr_id TTTT1002U(미국 매수 주문)]

      00 : 지정가

      32 : LOO(장개시지정가)

      34 : LOC(장마감지정가)

      35 : TWAP (시간가중평균)

      36 : VWAP (거래량가중평균)

      * 모의투자 VTTT1002U(미국 매수 주문)로는 00:지정가만 가능

      * TWAP, VWAP 주문은 분할시간 주문 입력 필수


      [Header tr_id TTTT1006U(미국 매도 주문)]

      00 : 지정가

      31 : MOO(장개시시장가)

      32 : LOO(장개시지정가)

      33 : MOC(장마감시장가)

      34 : LOC(장마감지정가)

      35 : TWAP (시간가중평균)

      36 : VWAP (거래량가중평균)

      * 모의투자 VTTT1006U(미국 매도 주문)로는 00:지정가만 가능

      * TWAP, VWAP 주문은 분할시간 주문 입력 필수


      [Header tr_id TTTS1001U(홍콩 매도 주문)]

      00 : 지정가

      50 : 단주지정가

      * 모의투자 VTTS1001U(홍콩 매도 주문)로는 00:지정가만 가능


      [그외 tr_id]

      제거


      ※ TWAP, VWAP 주문은 정정 불가'
  - code: START_TIME
    name: 시작시간
    type: A0001
    type_name: String
    length: '6'
    required: false
    description: '※ TWAP, VWAP 주문유형이고 알고리즘주문시간구분코드가 00일때 사용

      ※ YYMMDD 형태로 입력

      ※ 시간 입력 시 정규장 종료 5분전까지 입력 가능'
  - code: END_TIME
    name: 종료시간
    type: A0001
    type_name: String
    length: '6'
    required: false
    description: '※ TWAP, VWAP 주문유형이고 알고리즘주문시간구분코드가 00일때 사용

      ※ YYMMDD 형태로 입력

      ※ 시간 입력 시 정규장 종료 5분전까지 입력 가능'
  - code: ALGO_ORD_TMD_DVSN_CD
    name: 알고리즘주문시간구분코드
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: '00 : 분할주문 시간 직접입력 , 02 : 정규장 종료시까지'
  example:
    CANO: 810XXXXX
    ACNT_PRDT_CD: '01'
    OVRS_EXCG_CD: NASD
    PDNO: AAPL
    ORD_QTY: '1'
    OVRS_ORD_UNPR: '145.00'
    CTAC_TLNO: ''
    MGCO_APTM_ODNO: ''
    ORD_SVR_DVSN_CD: '0'
    ORD_DVSN: '00'
response:
  headers:
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '40'
    required: true
    description: application/json; charset=utf-8
  body:
  - code: rt_cd
    name: 성공 실패 여부
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: "0 : 성공 \n0 이외의 값 : 실패"
  - code: msg_cd
    name: 응답코드
    type: A0001
    type_name: String
    length: '8'
    required: true
    description: 응답코드
  - code: msg1
    name: 응답메세지
    type: A0001
    type_name: String
    length: '80'
    required: true
    description: 응답메세지
  - code: output
    name: 응답상세
    type: A0003
    type_name: String
    length: ''
    required: true
    description: ''
  - code: KRX_FWDG_ORD_ORGNO
    name: 한국거래소전송주문조직번호
    type: A0001
    type_name: String
    length: '5'
    required: true
    description: 주문시 한국투자증권 시스템에서 지정된 영업점코드
  - code: ODNO
    name: 주문번호
    type: A0001
    type_name: String
    length: '10'
    required: true
    description: 주문시 한국투자증권 시스템에서 채번된 주문번호
  - code: ORD_TMD
    name: 주문시각
    type: A0001
    type_name: String
    length: '6'
    required: true
    description: 주문시각(시분초HHMMSS)
  example:
    rt_cd: '0'
    msg_cd: APBK0013
    msg1: 주문 전송 완료 되었습니다.
    output:
      KRX_FWDG_ORD_ORGNO: 01790
      ODNO: '0000004336'
      ORD_TMD: '160524'
errors: []
