summary: "해외옵션종목상세 API입니다.\n\n(주의) sstl_price 자리에 정산가 X 전일종가 O 가 수신되는 점 유의 부탁드립니다.\n\n(중요) 해외옵션시세 출력값을 해석하실 때 focode.mst(해외지수옵션\
  \ 종목마스터파일), fostkcode.mst(해외주식옵션 종목마스터파일)에 있는 sCalcDesz(계산 소수점) 값을 활용하셔야 정확한 값을 받아오실 수 있습니다.\n\n- focode.mst(해외지수옵션 종목마스터파일),\
  \ fostkcode.mst(해외주식옵션 종목마스터파일) 다운로드 방법\n  1) focode.mst(해외지수옵션 종목마스터파일)\n     : 포럼 > FAQ > 종목정보 다운로드(해외) - 해외지수옵션 클릭하여\
  \ 다운로드 후\n       Github의 헤더정보(https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/해외옵션정보.h)를 참고하여\
  \ 해석\n  2) fostkcode.mst(해외주식옵션 종목마스터파일)\n     : 포럼 > FAQ > 종목정보 다운로드(해외) - 해외주식옵션 클릭하여 다운로드 후\n       Github의 헤더정보(https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/해외주식옵션정보.h)를\
  \ 참고하여 해석\n\n- 소수점 계산 시, focode.mst(해외지수옵션 종목마스터파일), fostkcode.mst(해외주식옵션 종목마스터파일)의 sCalcDesz(계산 소수점) 값 참고\n  EX) focode.mst\
  \ 파일의 sCalcDesz(계산 소수점) 값\n       품목코드 OES 계산소수점 -2 → 시세 7525 수신 시 75.25 로 해석\n       품목코드 O6E 계산소수점 -4 → 시세 54.0 수신 시 0.0054\
  \ 로 해석"
