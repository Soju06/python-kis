name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs가 태그에서 버전을 읽으려면 전체 히스토리가 필요합니다.
          # 없으면 fallback-version("0.0.0")인 아티팩트가 만들어집니다.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build

      # 빌드된 버전이 사전 릴리스인지 판별합니다. 아래 두 업로드 잡이
      # 이 값으로 갈립니다. 문자열 매칭 대신 PEP 440 파서를 쓰는 이유:
      # "2.2.0rc1", "2.2.0a1", "2.2.0.dev1" 을 모두 정확히 잡아야 합니다.
      - name: Version info
        id: version
        run: |
          uv run --isolated --no-project --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, os
          from packaging.utils import parse_wheel_filename

          _, version, _, _ = parse_wheel_filename(os.path.basename(glob.glob("dist/*.whl")[0]))
          prerelease = version.is_prerelease or version.is_devrelease
          print(f"version={version}")
          print(f"prerelease={str(prerelease).lower()}")
          PY

      # 태그와 실제로 빌드된 버전이 일치하는지 확인합니다.
      # hatch-vcs가 태그를 못 읽으면 여기서 멈춥니다.
      # 앞 스텝이 packaging으로 이미 정규화한 값을 씁니다. 파일명을 다시 파싱하면
      # 같은 정보를 두 방식으로 구하게 되어 어긋날 수 있습니다.
      #
      # 태그에 붙임표를 쓰면(v0.0.1-rc1) PEP 440 정규화 결과가 0.0.1rc1이 되어
      # 여기서 걸립니다. v0.0.1rc1 형태로 쓰세요.
      - name: Tag matches built version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUILT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag built=$BUILT_VERSION"
          if [ "$tag" != "$BUILT_VERSION" ]; then
            echo "::error::태그($tag)와 빌드 버전($BUILT_VERSION)이 다릅니다"
            exit 1
          fi

      - name: Metadata check
        run: uvx --from 'twine>=6' twine check --strict dist/*

      # 휠 내용 검증. 이름 변경 이후 옛 패키지가 섞여 들어가거나
      # py.typed가 빠지는 회귀를 잡습니다.
      #
      # core metadata 버전도 여기서 봅니다. twine check는 형식만 보고 PyPI가
      # 그 버전을 받는지는 모릅니다. hatchling이 기본값을 올려도(1.32.0이 2.4→2.5로
      # 이미 한 번 올렸습니다) 게시 시도 전에 잡히도록 합니다. 이슈 #27 참고.
      - name: Wheel contents
        run: |
          python - <<'PY'
          import email, glob, re, sys, tarfile, zipfile

          # warehouse/forklift/metadata.py 의 SUPPORTED_METADATA_VERSIONS.
          # PyPI가 받는 값이 늘면 여기도 함께 늘리세요.
          SUPPORTED_METADATA_VERSIONS = {"1.0", "1.1", "1.2", "2.1", "2.2", "2.3", "2.4", "2.5"}

          problems = []

          whl = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(whl)
          names = zf.namelist()

          if "vmkis/py.typed" not in names:
              problems.append("vmkis/py.typed 누락 (Typing :: Typed classifier와 어긋남)")
          if any(n.startswith("pykis/") for n in names):
              problems.append("옛 패키지 pykis/ 가 휠에 포함됨")
          if any(n.startswith("tests/") for n in names):
              problems.append("tests/ 가 휠에 포함됨")


          def metadata_version(raw: bytes) -> str | None:
              return email.message_from_bytes(raw).get("Metadata-Version")

          checked = {}

          meta_name = next(n for n in names if re.fullmatch(r"[^/]+\.dist-info/METADATA", n))
          checked["휠"] = metadata_version(zf.read(meta_name))

          sdists = glob.glob("dist/*.tar.gz")
          if sdists:
              with tarfile.open(sdists[0]) as tf:
                  pkg_info = next(n for n in tf.getnames() if re.fullmatch(r"[^/]+/PKG-INFO", n))
                  checked["sdist"] = metadata_version(tf.extractfile(pkg_info).read())

          for label, version in checked.items():
              if version not in SUPPORTED_METADATA_VERSIONS:
                  problems.append(
                      f"{label}의 Metadata-Version 이 {version!r} 입니다. "
                      f"PyPI가 받는 값: {sorted(SUPPORTED_METADATA_VERSIONS)}. "
                      "pyproject.toml 의 core-metadata-version 고정을 확인하세요."
                  )

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          print("휠 내용 정상:", sorted({n.split("/")[0] for n in names}))
          print("Metadata-Version:", checked)
          PY

      # 격리 환경에서 실제로 import되는지 확인합니다.
      # 런타임 의존성 누락(예: pyyaml)을 여기서 잡습니다.
      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import vmkis
          from vmkis import VmKis

          print(vmkis.__file__, vmkis.__version__)

          assert not vmkis.__version__.startswith("0.0.0"), "버전이 fallback 값입니다"
          assert vmkis.create_client is not None, "helpers import 실패 (런타임 의존성 확인)"
          assert vmkis.SimpleKIS is not None
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 사전 릴리스 태그(v2.2.0rc1 등)는 TestPyPI로만 갑니다.
  # 실제 배포와 같은 경로(빌드 → 검증 → OIDC 업로드)를 그대로 리허설합니다.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    # 태그에서만 올립니다. 브랜치에서 빌드하면 hatch-vcs가 로컬 버전
    # 식별자("+g1234abc")를 붙이고, 인덱스는 그런 파일을 거부합니다.
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vm-stock-kis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: build
    # 정식 릴리스 태그만. rc/alpha/beta/dev는 위 TestPyPI 잡이 처리합니다.
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vm-stock-kis
    permissions:
      # trusted publishing (OIDC) 및 PEP 740 attestations
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
