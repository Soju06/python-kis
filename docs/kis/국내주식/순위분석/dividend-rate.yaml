  종목조건검색 API는 HTS(efriend Plus) [0110] 조건검색에서 등록 및 서버저장한 나의 조건 목록을 확인할 수 있는 API로,\n자세한 사용 방법은 공지사항 - [조건검색 필독] 조건검색 API 이용안내\
  \ 참고 부탁드립니다."
