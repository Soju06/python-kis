summary: "국내주식 장운영정보 연결 시, 연결종목의 VI 발동 시와 VI 해제 시에 데이터 수신됩니다. \n\n[참고자료]\n실시간시세(웹소켓) 파이썬 샘플코드는 한국투자증권 Github 참고 부탁드립니다.\n\
  https://github.com/koreainvestment/open-trading-api/blob/main/websocket/python/ws_domestic_overseas_all.py\n\n실시간시세(웹소켓)\
  \ API 사용방법에 대한 자세한 설명은 한국투자증권 Wikidocs 참고 부탁드립니다.\nhttps://wikidocs.net/book/7847 (국내주식 업데이트 완료, 추후 해외주식·국내선물옵션 업데이트 예정)\n\
  \n종목코드 마스터파일 파이썬 정제코드는 한국투자증권 Github 참고 부탁드립니다.\nhttps://github.com/koreainvestment/open-trading-api/tree/main/stocks_info\n\
  \n[호출 데이터]\n헤더와 바디 값을 합쳐 JSON 형태로 전송합니다.\n\n[응답 데이터]\n1. 정상 등록 여부 (JSON)\n- JSON[\"body\"][\"msg1\"] - 정상 응답 시, SUBSCRIBE\
  \ SUCCESS\n- JSON[\"body\"][\"output\"][\"iv\"] - 실시간 결과 복호화에 필요한 AES256 IV (Initialize Vector)\n- JSON[\"body\"][\"output\"\
  ][\"key\"] - 실시간 결과 복호화에 필요한 AES256 Key\n\n2. 실시간 결과 응답 ( | 로 구분되는 값)\nex) 0|H0STCNT0|004|005930^123929^73100^5^...\n- 암호화\
  \ 유무 : 0 암호화 되지 않은 데이터 / 1 암호화된 데이터\n- TR_ID : 등록한 tr_id (ex. H0STCNT0)\n- 데이터 건수 : (ex. 001 인 경우 데이터 건수 1건, 004인 경우 데이터\
  \ 건수 4건)\n- 응답 데이터 : 아래 response 데이터 참조 ( ^로 구분됨)"
