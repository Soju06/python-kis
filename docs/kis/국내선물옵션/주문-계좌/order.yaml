id: 73a1bb73-fd91-4d70-bba1-f3241f12e7ff
name: 선물옵션 주문[v1_국내선물-001]
section: '[국내선물옵션] 주문/계좌'
category: 국내선물옵션
subcategory: 주문/계좌
method: POST
url: /uapi/domestic-futureoption/v1/trading/order
content_type: application/json; charset=UTF-8
req_format: JSON
domains:
  real: https://openapi.koreainvestment.com:9443
  virtual: https://openapivts.koreainvestment.com:29443
tr_ids:
- (주간 매수/매도) TTTO1101U (야간 매수/매도) (구) JTCE1001U (신) STTN1101U
- (주간 매수/매도) VTTO1101U (야간은 모의투자 미제공)
real_tr_id: (주간 매수/매도) TTTO1101U (야간 매수/매도) (구) JTCE1001U (신) STTN1101U
virtual_tr_id: (주간 매수/매도) VTTO1101U (야간은 모의투자 미제공)
summary: "​선물옵션 주문 API입니다.\n* 선물옵션 운영시간 외 API 호출 시 애러가 발생하오니 운영시간을 확인해주세요.\n\n※ POST API의 경우 BODY값의 key값들을 대문자로 작성하셔야 합니다.\n\
  \   (EX. \"CANO\" : \"12345678\", \"ACNT_PRDT_CD\": \"01\",...)\n\n※ 종목코드 마스터파일 파이썬 정제코드는 한국투자증권 Github 참고 부탁드립니다.\n   https://github.com/koreainvestment/open-trading-api/tree/main/stocks_info"
description: '[국내선물-001 v1] 선물옵션주문'
metadata:
  organization: 한국투자증권
  billing_policy: 무과금
  status: RUNNING
  created_date: '2021-12-15T13:03:14+09:00'
  last_modified_date: '2025-06-23T14:03:44+09:00'
request:
  headers:
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '40'
    required: false
    description: application/json; charset=utf-8
  - code: authorization
    name: 접근토큰
    type: A0001
    type_name: String
    length: '350'
    required: true
    description: "OAuth 토큰이 필요한 API 경우 발급한 Access token \n일반고객(Access token 유효기간 1일, OAuth 2.0의 Client Credentials Grant 절차를\
      \ 준용) \n법인(Access token 유효기간 3개월, Refresh token 유효기간 1년, OAuth 2.0의 Authorization Code Grant 절차를 준용)\n\n※ 토큰 지정시 토큰\
      \ 타입(\"Bearer\") 지정 필요. 즉, 발급받은 접근토큰 앞에 앞에 \"Bearer\" 붙여서 호출\nEX) \"Bearer eyJ..........8GA\""
  - code: appkey
    name: '앱키 '
    type: A0001
    type_name: String
    length: '36'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appkey (절대 노출되지 않도록 주의해주세요.)
  - code: appsecret
    name: 앱시크릿키
    type: A0001
    type_name: String
    length: '180'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appsecret (절대 노출되지 않도록 주의해주세요.)
  - code: personalseckey
    name: 고객식별키
    type: A0001
    type_name: String
    length: '180'
    required: false
    description: '[법인 필수] 제휴사 회원 관리를 위한 고객식별키'
  - code: tr_id
    name: 거래ID
    type: A0001
    type_name: String
    length: '13'
    required: true
    description: "[실전투자]\nTTTO1101U : 선물 옵션 매수 매도 주문 주간\n(구) JTCE1001U : 선물 옵션 매수 매도 주문 야간\n(신) STTN1101U : 선물 옵션 매수 매도 주문\
      \ 야간 \n\n[모의투자]\nVTTO1101U : 선물 옵션 매수 매도 주문 주간"
  - code: tr_cont
    name: 연속 거래 여부
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: tr_cont를 이용한 다음조회 불가 API
  - code: custtype
    name: 고객타입
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: "B : 법인 \nP : 개인"
  - code: seq_no
    name: 일련번호
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: '[법인 필수] 001'
  - code: mac_address
    name: 맥주소
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: 법인고객 혹은 개인고객의 Mac address 값
  - code: phone_number
    name: 핸드폰번호
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: "[법인 필수] 제휴사APP을 사용하는 경우 사용자(회원) 핸드폰번호 \nex) 01011112222 (하이픈 등 구분값 제거)"
  - code: ip_addr
    name: 접속 단말 공인 IP
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: '[법인 필수] 사용자(회원)의 IP Address'
  - code: gt_uid
    name: Global UID
    type: A0001
    type_name: String
    length: '32'
    required: false
    description: '[법인 전용] 거래고유번호로 사용하므로 거래별로 UNIQUE해야 함'
  params: []
  body:
  - code: ORD_PRCS_DVSN_CD
    name: 주문처리구분코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: '02 : 주문전송'
  - code: CANO
    name: 종합계좌번호
    type: A0001
    type_name: String
    length: '8'
    required: true
    description: 계좌번호 체계(8-2)의 앞 8자리
  - code: ACNT_PRDT_CD
    name: 계좌상품코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: 계좌번호 체계(8-2)의 뒤 2자리
  - code: SLL_BUY_DVSN_CD
    name: 매도매수구분코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: '01 : 매도

      02 : 매수'
  - code: SHTN_PDNO
    name: 단축상품번호
    type: A0001
    type_name: String
    length: '12'
    required: true
    description: '종목번호

      선물 6자리 (예: 101S03)

      옵션 9자리 (예: 201S03370)'
  - code: ORD_QTY
    name: 주문수량
    type: A0001
    type_name: String
    length: '10'
    required: true
    description: ''
  - code: UNIT_PRICE
    name: 주문가격1
    type: A0001
    type_name: String
    length: '23'
    required: true
    description: 시장가나 최유리 지정가인 경우 0으로 입력
  - code: NMPR_TYPE_CD
    name: 호가유형코드
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: "※ ORD_DVSN_CD(주문구분코드)를 입력한 경우 \"\"(공란)으로 입력해도 됨\n01 : 지정가\n02 : 시장가 \n03 : 조건부\n04 : 최유리"
  - code: KRX_NMPR_CNDT_CD
    name: 한국거래소호가조건코드
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: '※ ORD_DVSN_CD(주문구분코드)를 입력한 경우 ""(공란)으로 입력해도 됨

      0 : 없음

      3 : IOC

      4 : FOK'
  - code: CTAC_TLNO
    name: 연락전화번호
    type: A0001
    type_name: String
    length: '20'
    required: false
    description: 고객의 연락 가능한 전화번호
  - code: FUOP_ITEM_DVSN_CD
    name: 선물옵션종목구분코드
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: 공란(Default)
  - code: ORD_DVSN_CD
    name: 주문구분코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: '01 : 지정가

      02 : 시장가

      03 : 조건부

      04 : 최유리,

      10 : 지정가(IOC)

      11 : 지정가(FOK)

      12 : 시장가(IOC)

      13 : 시장가(FOK)

      14 : 최유리(IOC)

      15 : 최유리(FOK)'
  example:
    ORD_PRCS_DVSN_CD: '02'
    CANO: 810XXXXX
    ACNT_PRDT_CD: '03'
    SLL_BUY_DVSN_CD: '02'
    SHTN_PDNO: 167R12
    ORD_QTY: '1'
    UNIT_PRICE: '123'
    NMPR_TYPE_CD: ''
    KRX_NMPR_CNDT_CD: ''
    CTAC_TLNO: ''
    FUOP_ITEM_DVSN_CD: ''
    ORD_DVSN_CD: '01'
response:
  headers:
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '40'
    required: true
    description: application/json; charset=utf-8
  body:
  - code: rt_cd
    name: 성공 실패 여부
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: '0 : 성공

      0 이외의 값 : 실패'
  - code: msg_cd
    name: 응답코드
    type: A0001
    type_name: String
    length: '8'
    required: true
    description: 응답코드
  - code: msg1
    name: 응답메세지
    type: A0001
    type_name: String
    length: '80'
    required: true
    description: 응답메세지
  - code: output
    name: 응답상세
    type: A0002
    type_name: String
    length: ''
    required: true
    description: ''
  - code: ACNT_NAME
    name: 계좌명
    type: A0001
    type_name: String
    length: '60'
    required: true
    description: 계좌의 고객명
  - code: TRAD_DVSN_NAME
    name: 매매구분명
    type: A0001
    type_name: String
    length: '60'
    required: true
    description: 매도/매수 등 구분값
  - code: ITEM_NAME
    name: 종목명
    type: A0001
    type_name: String
    length: '60'
    required: true
    description: 주문 종목 명칭
  - code: ORD_TMD
    name: 주문시각
    type: A0001
    type_name: String
    length: '6'
    required: true
    description: 주문 접수 시간
  - code: ORD_GNO_BRNO
    name: 주문채번지점번호
    type: A0001
    type_name: String
    length: '5'
    required: true
    description: 계좌 개설 시 관리점으로 선택한 영업점의 고유번호
  - code: ODNO
    name: 주문번호
    type: A0001
    type_name: String
    length: '10'
    required: true
    description: 접수한 주문의 일련번호
  example:
    rt_cd: '0'
    msg_cd: APBK0029
    msg1: 주문전송이 정상적으로 처리되었습니다.
    output:
      ACNT_NAME: 류민수
      TRAD_DVSN_NAME: 매도
      ITEM_NAME: 코스피200 F 202203
      ORD_TMD: '131604'
      ORD_GNO_BRNO: '06010'
      ODNO: '0000007045'
errors: []
