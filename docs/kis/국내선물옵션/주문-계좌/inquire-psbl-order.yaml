    length: '2'
    required: false
    description: '01 : 지정가

      02 : 시장가

      03 : 조건부

      04 : 최유리,

      10 : 지정가(IOC)

      11 : 지정가(FOK)

      12 : 시장가(IOC)

      13 : 시장가(FOK)

      14 : 최유리(IOC)

      15 : 최유리(FOK)'
  example:
