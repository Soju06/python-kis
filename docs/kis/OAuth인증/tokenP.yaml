id: fa778c98-f68d-451e-8fff-b1c6bfe5cd30
name: 접근토큰발급(P)[인증-001]
section: OAuth인증
category: ''
subcategory: OAuth인증
method: POST
url: /oauth2/tokenP
content_type: application/json; charset=UTF-8
req_format: JSON
domains:
  real: https://openapi.koreainvestment.com:9443
  demo: https://openapivts.koreainvestment.com:29443
real_tr_id: ''
demo_tr_id: ''
summary: "본인 계좌에 필요한 인증 절차로, 인증을 통해 접근 토큰을 부여받아 오픈API 활용이 가능합니다.\n\n1. 접근토큰(access_token)의 유효기간은 24시간 이며(1일 1회발급 원칙) \n  \
  \ 갱신발급주기는 6시간 입니다.(6시간 이내는 기존 발급키로 응답)\n\n2. 접근토큰발급(/oauth2/tokenP) 시 접근토큰값(access_token)과 함께 수신되는 \n   접근토큰 유효기간(acess_token_token_expired)을\
  \ 이용해 접근토큰을 관리하실 수 있습니다.\n\n\n[참고]\n\n'23.4.28 이후 지나치게 잦은 토큰 발급 요청건을 제어 하기 위해 신규 접근토큰발급 이후 일정시간 이내에 재호출 시에는 직전 토큰값을 리턴하게\
  \ 되었습니다. 일정시간 이후 접근토큰발급 API 호출 시에는 신규 토큰값을 리턴합니다. \n접근토큰발급 API 호출 및 코드 작성하실 때 해당 사항을 참고하시길 바랍니다.\n\n※ 참고 : 포럼 > 공지사항 > \
  \ [수정] [중요] 접근 토큰 발급 변경 안내"
description: ''
metadata:
  organization: 한국투자증권
  billing_policy: 무과금
  status: RUNNING
  created_date: '2022-04-24T09:54:42+09:00'
