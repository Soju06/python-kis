request:
  headers: []
  params: []
  body:
  - code: grant_type
    name: 권한부여 Type
    type: A0001
    type_name: String
    length: '18'
    required: true
    description: client_credentials
  - code: appkey
    name: 앱키
    type: A0001
    type_name: String
    length: '36'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appkey (절대 노출되지 않도록 주의해주세요.)
  - code: appsecret
    name: 앱시크릿키
    type: A0001
    type_name: String
    length: '180'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appsecret (절대 노출되지 않도록 주의해주세요.)
  example:
    grant_type: client_credentials
    appkey: PSg5dctL9dKPo727J13Ur405OSXXXXXXXXXX
    appsecret: yo2t8zS68zpdjGuWvFyM9VikjXE0i0CbgPEamnqPA00G0bIfrdfQb2RUD1xP7SqatQXr1cD1fGUNsb78MMXoq6o4lAYt9YTtHAjbMoFy+c72kbq5owQY1Pvp39/x6ejpJlXCj7gE3yVOB/h25Hvl+URmYeBTfrQeOqIAOYc/OIXXXXXXXXXX
response:
  headers: []
  body:
  - code: access_token
    name: 접근토큰
    type: A0001
    type_name: String
    length: '350'
    required: true
    description: "OAuth 토큰이 필요한 API 경우 발급한 Access token\nex) \"eyJ0eXUxMiJ9.eyJz…...................................\"\n\n\
      \ - 일반개인고객/일반법인고객\n  . Access token 유효기간 1일\n  .. 일정시간(6시간) 이내에 재호출 시에는 직전 토큰값을 리턴\n  . OAuth 2.0의 Client Credentials\
      \ Grant 절차를 준용\n\n - 제휴법인\n  . Access token 유효기간 3개월\n  . Refresh token 유효기간 1년\n  . OAuth 2.0의 Authorization Code Grant\
      \ 절차를 준용"
  - code: token_type
    name: 접근토큰유형
    type: A0001
    type_name: String
    length: '20'
    required: true
    description: '접근토큰유형 : "Bearer"

      ※ API 호출 시, 접근토큰유형 "Bearer" 입력. ex) "Bearer eyJ...."'
  - code: expires_in
    name: 접근토큰 유효기간
    type: A0004
    type_name: Number
    length: '10'
    required: true
    description: '유효기간(초)

      ex) 7776000'
  - code: access_token_token_expired
    name: 접근토큰 유효기간(일시표시)
    type: A0001
    type_name: String
    length: '50'
    required: true
    description: '유효기간(년:월:일 시:분:초)

      ex) "2022-08-30 08:10:10"'
