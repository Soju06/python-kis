summary: "해외선물분봉조회 API입니다. ★ 반드시 아래 호출방법을 확인하시고 호출 사용하시기 바랍니다.\n한국투자 HTS(eFriend Force) > [5502] 해외선물옵션 체결추이 화면에서 \"분\" 선택\
  \ 시 기능을 API로 개발한 사항으로, 해당 화면을 참고하시면 기능을 이해하기 쉽습니다.\n\n\n※ 해외선물분봉조회 조회 방법\nparams\n. START_DATE_TIME: 공란 입력 (\"\")\n. CLOSE_DATE_TIME:\
  \ 조회일자 입력 (\"20231214\")\n. QRY_CNT: 120 입력 시, 가장 최근 분봉 120건 조회( 한번에 최대 120건 조회 가능)\n                240 입력 시, 240 이전 분봉\
  \ ~ 120 이전 분봉 조회\n                360 입력 시, 360 이전 분봉 ~ 240 이전 분봉 조회\n. QRY_TP: 처음조회시, 공백 입력\n              다음조회시, P 입력\n\
  . INDEX_KEY: 처음조회시, 공백 입력\n                  다음조회시, 이전 조회 응답의 output2 > index_key 값 입력\n\n* 따라서 분봉데이터를 기간별로 수집하고자 하실 경우\
  \ QRY_TP, INDEX_KEY 값을 이용하시면서 다음조회하시면 됩니다.\n\n(중요) 해외옵션시세 출력값을 해석하실 때 focode.mst(해외지수옵션 종목마스터파일), fostkcode.mst(해외주식옵션 종목마스터파일)에\
  \ 있는 sCalcDesz(계산 소수점) 값을 활용하셔야 정확한 값을 받아오실 수 있습니다.\n\n- focode.mst(해외지수옵션 종목마스터파일), (해외주식옵션 종목마스터파일) 다운로드 방법\n  1) focode.mst(해외지수옵션\
  \ 종목마스터파일)\n     : 포럼 > FAQ > 종목정보 다운로드(해외) - 해외지수옵션 클릭하여 다운로드 후\n       Github의 헤더정보(https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/해외옵션정보.h)를\
  \ 참고하여 해석\n  2) fostkcode.mst(해외주식옵션 종목마스터파일)\n     : 포럼 > FAQ > 종목정보 다운로드(해외) - 해외주식옵션 클릭하여 다운로드 후\n       Github의 헤더정보(https://github.com/koreainvestment/open-trading-api/blob/main/stocks_info/해외주식옵션정보.h)를\
  \ 참고하여 해석\n\n- 소수점 계산 시, focode.mst(해외지수옵션 종목마스터파일), fostkcode.mst(해외주식옵션 종목마스터파일)의 sCalcDesz(계산 소수점) 값 참고\n  EX) focode.mst\
  \ 파일의 sCalcDesz(계산 소수점) 값\n       품목코드 OES 계산소수점 -2 → 시세 7525 수신 시 75.25 로 해석\n       품목코드 O6E 계산소수점 -4 → 시세 54.0 수신 시 0.0054\
  \ 로 해석\n\n※ CME, SGX 거래소 API시세는 유료시세로 HTS/MTS에서 유료가입 후 익일부터 시세 이용 가능합니다.\n포럼 > FAQ > 해외선물옵션 API 유료시세 신청방법(CME, SGX 거래소)"
