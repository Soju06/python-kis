summary: "해외선물옵션 주문 API 입니다.\n\n※ POST API의 경우 BODY값의 key값들을 대문자로 작성하셔야 합니다.\n   (EX. \"CANO\" : \"12345678\", \"ACNT_PRDT_CD\"\
  : \"01\",...)\n\n※ 종목코드 마스터파일 파이썬 정제코드는 한국투자증권 Github 참고 부탁드립니다.\n   https://github.com/koreainvestment/open-trading-api/tree/main/stocks_info"
description: ''
metadata:
  organization: 한국투자증권
  billing_policy: 무과금
  status: RUNNING
  created_date: '2022-08-05T14:37:28+09:00'
  last_modified_date: '2025-04-30T12:53:03+09:00'
request:
  headers:
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '40'
    required: true
    description: application/json; charset=utf-8
  - code: authorization
    name: 접근토큰
    type: A0001
    type_name: String
    length: '350'
    required: true
    description: "OAuth 토큰이 필요한 API 경우 발급한 Access token \n일반고객(Access token 유효기간 1일, OAuth 2.0의 Client Credentials Grant 절차를\
      \ 준용) \n법인(Access token 유효기간 3개월, Refresh token 유효기간 1년, OAuth 2.0의 Authorization Code Grant 절차를 준용)\n\n※ 토큰 지정시 토큰\
      \ 타입(\"Bearer\") 지정 필요. 즉, 발급받은 접근토큰 앞에 앞에 \"Bearer\" 붙여서 호출\nEX) \"Bearer eyJ..........8GA\""
  - code: appkey
    name: 앱키
    type: A0001
    type_name: String
    length: '36'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appkey (절대 노출되지 않도록 주의해주세요.)
  - code: appsecret
    name: 앱시크릿키
    type: A0001
    type_name: String
    length: '180'
    required: true
    description: 한국투자증권 홈페이지에서 발급받은 appkey (절대 노출되지 않도록 주의해주세요.)
  - code: personalseckey
    name: 고객식별키
    type: A0001
    type_name: String
    length: '180'
    required: false
    description: '[법인 필수] 제휴사 회원 관리를 위한 고객식별키'
  - code: tr_id
    name: 거래ID
    type: A0001
    type_name: String
    length: '13'
    required: true
    description: '[실전투자]

      OTFM3001U : ASFM선물옵션주문신규'
  - code: tr_cont
    name: 연속 거래 여부
    type: A0001
    type_name: String
    length: '1'
    required: false
    description: tr_cont를 이용한 다음조회 불가 API
  - code: custtype
    name: 고객 타입
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: "B : 법인 \nP : 개인"
  - code: seq_no
    name: 일련번호
    type: A0001
    type_name: String
    length: '2'
    required: false
    description: '[법인 필수] 001'
  - code: mac_address
    name: 맥주소
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: 법인고객 혹은 개인고객의 Mac address 값
  - code: phone_number
    name: 핸드폰번호
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: "[법인 필수] 제휴사APP을 사용하는 경우 사용자(회원) 핸드폰번호 \nex) 01011112222 (하이픈 등 구분값 제거)"
  - code: ip_addr
    name: 접속 단말 공인 IP
    type: A0001
    type_name: String
    length: '12'
    required: false
    description: '[법인 필수] 사용자(회원)의 IP Address'
  - code: gt_uid
    name: Global UID
    type: A0001
    type_name: String
    length: '32'
    required: false
    description: '[법인 전용] 거래고유번호로 사용하므로 거래별로 UNIQUE해야 함'
  params: []
  body:
  - code: CANO
    name: 종합계좌번호
    type: A0001
    type_name: String
    length: '8'
    required: true
    description: 계좌번호 체계(8-2)의 앞 8자리
  - code: ACNT_PRDT_CD
    name: 계좌상품코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: 계좌번호 체계(8-2)의 뒤 2자리
  - code: OVRS_FUTR_FX_PDNO
    name: 해외선물FX상품번호
    type: A0001
    type_name: String
    length: '32'
    required: true
    description: ''
  - code: SLL_BUY_DVSN_CD
    name: 매도매수구분코드
    type: A0001
    type_name: String
    length: '2'
    required: true
    description: '01 : 매도

      02 : 매수'
  - code: FM_LQD_USTL_CCLD_DT
    name: FM청산미결제체결일자
    type: A0001
    type_name: String
    length: '8'
    required: false
    description: 빈칸 (hedge청산만 이용)
  - code: FM_LQD_USTL_CCNO
    name: FM청산미결제체결번호
    type: A0001
    type_name: String
    length: '10'
    required: false
    description: 빈칸 (hedge청산만 이용)
  - code: PRIC_DVSN_CD
    name: 가격구분코드
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: 1.지정, 2. 시장, 3. STOP, 4 S/L
  - code: FM_LIMIT_ORD_PRIC
    name: FMLIMIT주문가격
    type: A0001
    type_name: String
    length: '20'
    required: true
    description: '지정가인 경우 가격 입력

      * 시장가, STOP주문인 경우, 빈칸("") 입력'
  - code: FM_STOP_ORD_PRIC
    name: FMSTOP주문가격
    type: A0001
    type_name: String
    length: '20'
    required: true
    description: 'STOP 주문 가격 입력

      * 시장가, 지정가인 경우, 빈칸("") 입력'
  - code: FM_ORD_QTY
    name: FM주문수량
    type: A0001
    type_name: String
    length: '10'
    required: true
    description: ''
  - code: FM_LQD_LMT_ORD_PRIC
    name: FM청산LIMIT주문가격
    type: A0001
    type_name: String
    length: '20'
    required: false
    description: 빈칸 (hedge청산만 이용)
  - code: FM_LQD_STOP_ORD_PRIC
    name: FM청산STOP주문가격
    type: A0001
    type_name: String
    length: '20'
    required: false
    description: 빈칸 (hedge청산만 이용)
  - code: CCLD_CNDT_CD
    name: 체결조건코드
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: "일반적으로 6 (EOD, 지정가) \nGTD인 경우 5, 시장가인 경우만 2"
  - code: CPLX_ORD_DVSN_CD
    name: 복합주문구분코드
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: 0 (hedge청산만 이용)
  - code: ECIS_RSVN_ORD_YN
    name: 행사예약주문여부
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: N
  - code: FM_HDGE_ORD_SCRN_YN
    name: FM_HEDGE주문화면여부
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: N
  example:
    CANO: '81012345'
    ACNT_PRDT_CD: 08
    OVRS_FUTR_FX_PDNO: 6BZ22
    SLL_BUY_DVSN_CD: '02'
    FM_LQD_USTL_CCLD_DT: ''
    FM_LQD_USTL_CCNO: ''
    PRIC_DVSN_CD: '1'
    FM_LIMIT_ORD_PRIC: '1.17'
    FM_STOP_ORD_PRIC: ''
    FM_ORD_QTY: '1'
    FM_LQD_LMT_ORD_PRIC: ''
    FM_LQD_STOP_ORD_PRIC: ''
    CCLD_CNDT_CD: '6'
    CPLX_ORD_DVSN_CD: '0'
    ECIS_RSVN_ORD_YN: N
    FM_HDGE_ORD_SCRN_YN: N
