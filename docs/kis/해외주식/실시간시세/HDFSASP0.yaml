  - code: custtype
    name: 고객 타입
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: 'B : 법인 / P : 개인'
  - code: tr_type
    name: 등록/해제
    type: A0001
    type_name: String
    length: '1'
    required: true
    description: '"1: 등록, 2:해제"'
  - code: content-type
    name: 컨텐츠타입
    type: A0001
    type_name: String
    length: '20'
    required: true
    description: utf-8
  params: []
  body:
  - code: tr_id
    name: 거래ID
    type: A0001
    type_name: String
    length: '7'
    required: true
    description: HDFSASP0
  - code: tr_key
    name: R거래소명종목코드
    type: A0001
    type_name: String
    length: '6'
    required: true
    description: 'D+시장구분(3자리)+종목코드

      예) DNASAAPL : D+NAS(나스닥)+AAPL(애플)

      [시장구분]

      NYS : 뉴욕, NAS : 나스닥, AMS : 아멕스



      R+시장구분(3자리)+종목코드

      예) RBAQAAPL : R+BAQ(나스닥)+AAPL(애플)

      [시장구분]

      BAY : 뉴욕(주간), BAQ : 나스닥(주간). BAA : 아멕스(주간)



      ※ 유료시세 신청시에만 유료시세 수신가능

      "포럼 > FAQ > 해외주식 유료시세 신청방법" 참고

      R+시장구분(3자리)+종목코드

      예) RHKS00003 : R+HKS(홍콩)+00003(홍콩중화가스)

      [시장구분]

      TSE : 도쿄, HKS : 홍콩,

      SHS : 상해, SZS : 심천

      HSX : 호치민, HNX : 하노이'
  example:
    header:
      approval_key: 35xxxxxa-bxxa-4xxb-87xxx-f56xxxxxxxxxx
      custtype: P
      tr_type: '1'
      content-type: utf-8
    body:
      input:
        tr_id: HDFSASP0
        tr_key: RBAQAAPL
