summary: "해외주식 잔고를 조회하는 API 입니다.\n한국투자 HTS(eFriend Plus) > [7600] 해외주식 종합주문 화면의 좌측 하단 '실시간잔고' 기능을 API로 개발한 사항으로, 해당 화면을 참고하시면\
  \ 기능을 이해하기 쉽습니다. \n다만 미국주간거래 가능종목에 대해서는 frcr_evlu_pfls_amt(외화평가손익금액), evlu_pfls_rt(평가손익율), ovrs_stck_evlu_amt(해외주식평가금액),\
  \ now_pric2(현재가격2) 값이 HTS와는 상이하게 표출될 수 있습니다.\n(주간시간 시간대에 HTS는 주간시세로 노출, API로는 야간시세로 노출)\n\n실전계좌의 경우, 한 번의 호출에 최대 100건까지\
  \ 확인 가능하며, 이후의 값은 연속조회를 통해 확인하실 수 있습니다. \n\n* 해외주식 서비스 신청 후 이용 가능합니다. (아래 링크 3번 해외증권 거래신청 참고)\nhttps://securities.koreainvestment.com/main/bond/research/_static/TF03ca010001.jsp\n\
  \n* 미니스탁 잔고는 해당 API로 확인이 불가합니다."
