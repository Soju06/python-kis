  \n\n* 해외 거래소 운영시간(한국시간 기준)\n1) 미국 : 23:30 ~ 06:00 (썸머타임 적용 시 22:30 ~ 05:00) \n   * 프리마켓(18:00 ~ 23:30, Summer Time : 17:00\
